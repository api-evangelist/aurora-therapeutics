name: Aurora Therapeutics
description: Aurora Therapeutics is a CRISPR gene-editing biotechnology company based
  in Cambridge, Massachusetts, developing scalable, personalized genetic medicines
  for rare diseases. Founded by gene-editing pioneers including Nobel laureate Jennifer
  Doudna and Fyodor Urnov and led by CEO Edward M. Kaye, the company uses an "umbrella"
  approach that bundles multiple rare disease-causing mutations under a single regulatory
  pathway, combining guide RNA design, AI-engineered editors, and delivery systems
  to correct mutations at scale. Backed by Menlo Ventures, Aurora is profiled in the
  API Evangelist network; as of this pass it publishes a corporate website and news
  surface but no public API, developer portal, SDK, or other technical/developer surface.
